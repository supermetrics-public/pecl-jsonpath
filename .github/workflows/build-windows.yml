name: Build and test on Windows

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ created ]

jobs:
  tests:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        version: [ "8.3", "8.4", "8.5", "8.6" ]
        arch: [ "x64" ]
        ts: [ "ts" ]
        include:
          - version: "8.3"
            os: windows-2022
          - version: "8.4"
            os: windows-2022
          - version: "8.5"
            os: windows-2022
          - version: "8.6"
            os: windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout jsonpath
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test jsonpath
        uses: php/php-windows-builder/extension@227d3cb94e4fd9e9ab9459020df2394ee9a00eb4 # v1
        with:
          php-version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          test-workers: "2"
          test-runner-args: '-q --offline --show-diff --set-timeout 120 -g FAIL,BORK,WARN,LEAK tests'
